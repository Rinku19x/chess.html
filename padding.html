<!DOCTYPE html>
<html>
    <head>
        <style>
        .container{
            border:2px solid black;
            padding:20px;
        }
        .item1{
            backgroung:lightblue;
            padding:20px;
        }
        item2{
            background:lightgreen;
            padding:20px 40px;
        }
        .item3{
            background:lightyellow;
            padding:20px 40px 10px;
        }
        .item4{
            background:peachpuff;
            padding:20px 40px 10px 0px;
        }
        </style>
    </head>
    <body>
        <h1>CSS Padding Example</h1>
        <div class="container">
            <div class="item1">padding:20px(all sides)</div>
            <div class="item2">padding:20px (top & bottom) and 40px (left & right)</div>
            <div class="item3">padding:20px 40px 10px (top, right/left, bottom)</div>
            <div class="item4">padding:20px 40px 10px 0px (top, right, bottom, left)</div>
        </div>
    </body>
</html>
