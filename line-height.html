<!DOCTYPE html>
<html>
    <head>
        <style>
            .normal{
                line-height:normal;
            }
            .number{
                line-heght:1.5;
            }
            .length{
                line-height:30px;
            }
            .percentage{
                line-height:150%;
            }
        </style>
    </head>
    <body>
        <h1>CSS line-height Property</h1>
        <p class="normal">This text uses the normal line-height,whhich is typically 1.2 to 1.4.</p>

        <p class="number">
            This text has a line-height of 1.5-1.5 times its font size.
        </p>

        <p class="length">
            This text has a fixed line-height of 30px.
        </p>

        <p class="percentage">
            This text has a line-height of 150% 
            That means 1.5 ttimes its font size.
        </p>
        </body>
</html>
