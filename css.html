<!DOCTYPE html>
<html>
    <head>
        <style>
            .normal{
                font-family: Arial,sans-serif;
                font-size:16px;
                font-weight:normal;
            }

            .bold{
                font-weight:bold;            
            }

            .italic{
                font-style:italic;
            }

            .small-caps{
                font-variant:small-caps;
            }

            .spaced-letters{
                letter-spacing:2px;
            }

            .spaced-words{
                word-spacing:10px;
            }

            .line-height{
                line-height:1.8;
            }
        </style>
    </head>
    <body>

            <h1>CSS Font Examples</h1>

            <p class="normal">Normal text with arial font</p>

            <p class="bold">bold text</p>
            <p class="italic">italic text</p>
            <p class="small-caps">small caps text</p>
            <p class="spaced-letters">spaced letters text</p>
            <p class="spaced-words">spaced words text</p>
            <p class="line-height">line height text</p>
    </body>
</html>
