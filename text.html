<!DOCTYPE html>
<html>
    <head>
        <style>
            .text-red{
                color:red;
            }
            .text-center{
                text-align:center;
            }

            .text-underline{
                text-decoration: overline;
            }

            .text-overline{
                text-decoration: overline;
            }
            
            .text-line-through{
                text-decoration: line-through;
            }

            .text-uppercase{
                text-transform: uppercase;
            }

            .text-lowercase{
                text-tranform :lowercase;
            }

            .text-capitalize{
                text-transform:capitalize;
            }

            .text-indent{
                text-indent:50px;
            }

            .text-letter-spacing{
                letter-spacing: 5px;
            }

            .text-word-spacing{
                word-spacing: 10px;
            }

            .text-shadow{
                text-shadow:2px 2px 5px #888888;
            }
        </style>
    </head>
        <body>

            <h1>CSS Text Example</h1>

            <p class="text-red">Red text color</p>

            <p class="text-center">Center aligned text</p>

            <p class="text-underline">Underline text </p>

            <p class="text-overline">Overlined text</p>

            <p class="text-uppercase">Uppercase text</p>

            <p class="text-lowecase">Lowecase text</p>

            <p class="text-capitalize">Capitalize text</p>

            <p class="text-indent">Indented first line of text</p>

            <p class="text-letter-spacing">letter spaced text</p>

            <p class="text-word-spacing">word spaced text</p>

            <p class="text-shadow">text with shadow</p>
        </body>
</html>
