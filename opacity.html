<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                border:2px solid black;
                padding:20px;
            }
            .item1{
                background:lightblue;
                padding:20px;
                opacity:1;
            }
            .item2{
                background:lightgreen;
                padding:20px;
                opacity:0.5;
            }
            .item3{
                background:lightyellow;
                padding:20px;
                opacity:0.2;
            }
        </style>
    </head>
    <body>
        <h1>CSS Opacity Example</h1>
        <div class="container">
            <div class="item1">Opacity 1.0</div>
            <div class="item2">Opacity 0.5</div>
            <div class="item3">Opacity 0.2</div>
        </div>
    </body>
</html>
