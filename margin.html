<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                border:2px solid black;
                padding:20px;
            }
            .item1{
                background:lightblue;
                margin:20px;
            }
            .item2{
                background:lightgreen;
                margin:20px 40px;
            }
            .item3{
                background:lightyellow;
                margin:20px 40px 10px;
            }
            .item4{
                background:peachpuff;
                margin:20px 40px 10px 0px;
            }
        </style>
    </head>
    <body>
        <h1>CSS Margin Example</h1>
        <div class="container">
            <div class="item1">margin:20px(all sides)</div>
            <div class="item2">margin:20px (top & bottom) and 40px (left & right)</div>
            <div class="item3">margin:20px 40px 10px (top, right/left, bottom)</div>
            <div class="item4">margin:20px 40px 10px 0px (top, right, bottom, left)</div>
        </div>
    </body>
</html>
